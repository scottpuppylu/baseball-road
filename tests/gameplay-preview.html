<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/story.css"><title>Baseball Road Gameplay QA</title></head><body><main><h2>原創2D Gameplay 技術驗證</h2><select id="type"><option value="batting">打擊</option><option value="fielding">守備</option><option value="running">跑壘</option></select><button id="start" class="primary">開始</button><div class="game-wrapper"><canvas id="canvas" width="960" height="540"></canvas><div id="status" class="game-status"></div><div id="feedback" class="game-feedback"></div></div><div class="input-meter"><div><i id="progress"></i><b></b></div></div><div class="fielding-map"><span id="target" class="landing-marker">落點</span><output id="fielder" class="fielder-position"></output></div><button id="left" class="move-button">←</button><button id="right" class="move-button">→</button><button id="action" class="primary">操作 / SPACE</button><button id="sound" class="subtle">聲音：關</button><button id="back" hidden>完成</button><pre id="performance"></pre><pre id="result"></pre></main><script type="module">
import {MiniGameRuntime} from '../src/minigame-runtime.js';let runtime;const $=id=>document.getElementById(id);$('start').onclick=()=>{runtime?.dispose();$('back').hidden=true;$('result').textContent='';const context={id:'qa-'+$('type').value,type:$('type').value,eventId:'qa',playerId:'qa',seed:42,profile:{power:60,contact:65,vision:70},difficulty:1,jersey:18,rules:{rounds:3,mission:'動作測試'},modifiers:{windowBonus:0,powerBonus:0,catchBonus:8,timingBonus:0,condition:80,runningGrowth:0}};runtime=new MiniGameRuntime(context,{canvas:$('canvas'),status:$('status'),feedback:$('feedback'),progress:$('progress'),target:$('target'),fielder:$('fielder'),action:$('action'),left:$('left'),right:$('right'),sound:$('sound'),back:$('back'),performance:$('performance')},r=>{$('result').textContent=JSON.stringify(r);$('back').disabled=false;});};
</script></body></html>
<style>pre{white-space:pre-wrap;overflow-wrap:anywhere}select{width:100%;min-height:44px}</style>
